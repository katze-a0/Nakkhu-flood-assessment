# Named Sept 2024 flood sites (aoi_flood_reach_sites_2024). Coordinates are fixed here; the build
# makes no live lookups. `lon`/`lat` are the registered values (WGS 84). The research run
# (2026-10-05) did not record its Nominatim query strings, so every `nominatim` entry gives the
# query and OSM object of a check made on 2026-10-05 around 18:40 UTC
# (nominatim.openstreetmap.org/search, countrycodes=np, first hit) whose result rounds to the
# stored coordinate at 4 decimals.
# Sources [S6], [S10], [S12] are the research references (research-area-imagery.md).
schema_version: 1
sites:
