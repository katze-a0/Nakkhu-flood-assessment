    citation: "Alaska Satellite Facility (2022). Global 30m Height Above Nearest Drainage (HAND). https://registry.opendata.aws/glo-30-hand/"
    clip: routing
    redistributable: "yes (CC0)"
  - id: dem_nasadem
    title: NASADEM (1 arc-second, SRTM Feb 2000 reprocessed), OpenTopography Global DEM API, clipped to routing domain + 2 km
    method: opentopo_globaldem
    params: {demtype: NASADEM, pad_deg: 0.01, vertical_datum: "EGM96 (EPSG:5773; OpenTopography dataset page OT.032021.4326.2, checked 2026-10-17); converted to EGM2008 in the HAND prepare step (configs/hand/sweep_dems.yaml geoids)"}
