# Source register for `nakkhu data fetch` (plan 002). Static, hand-written metadata per dataset:
# where it comes from, its licence and how it is clipped. The fetcher measures everything else
# (bytes, sha256, retrieval time, per-file provenance) and writes it to manifest.yaml and to
# <local_path>/source.json. `{date}` in a text field becomes the retrieval date (UTC).
#
# Licences were checked on the live source pages on 2026-10-05 (plan 002 STOP condition).
# `redistributable` feeds artifacts/data/licences.csv: may we re-share the fetched files?
schema_version: 1

stac:
  maxar_collection: https://maxar-opendata.s3.amazonaws.com/events/Nepal-Floods-Sept-2024/collection.json
  maxar_acquisitions: https://maxar-opendata.s3.amazonaws.com/events/Nepal-Floods-Sept-2024/ard/acquisition_collections/
  earth_search: https://earth-search.aws.element84.com/v1

maxar_common: &maxar
  access: public
  licence: CC BY-NC 4.0
  attribution: "Contains Maxar Open Data, copyright Maxar Intelligence (now Vantor), CC BY-NC 4.0"
  citation: "Vantor Open Data Program was accessed on {date} from https://registry.opendata.aws/vantor-open-data"
  redistributable: "no: CC BY-NC 4.0; keep local or in private Kaggle datasets only (plan 002)"

sources:
  # --- AOI (Step 1) -------------------------------------------------------------------------
  - id: aoi_analysis_extent
    title: Analysis extent, 13.34 km2 (catchment c4 + 1 km confluence disc, clipped to the Maxar WV02/GE01 overlap)
    method: aoi_build
    params: {product: analysis_extent, dest: configs/aoi/aoi_recommended_analysis_extent.geojson}
    url: "derived: nakkhu aoi build --only analysis_extent (src/nakkhu/aoi/extent.py, configs/aoi/build.yaml; ported from configs/aoi/scripts/recommend.py)"
    access: public
    licence: "own work (derived from Copernicus GLO-30, OSM ODbL lines and Maxar STAC footprints)"
    attribution: "Nakkhu flood-exposure project"
    citation: "this work"
    clip: none
    redistributable: "yes"
  - id: aoi_routing_domain
    title: HAND routing domain, upper Bagmati to 1.2 km below the Nakkhu confluence (590.5 km2, unburned GLO-30)
    method: aoi_build
    params: {product: routing_domain, dest: configs/aoi/routing_domain_upper_bagmati_glo30.geojson}
    url: "derived: nakkhu aoi build --only routing_domain (src/nakkhu/aoi/basins.py, configs/aoi/build.yaml; ported from configs/aoi/scripts/basins.py)"
    access: public
    licence: "own work (derived from Copernicus GLO-30)"
    attribution: "Nakkhu flood-exposure project; produced using Copernicus WorldDEM-30"
    citation: "this work"
    clip: none
    redistributable: "yes"
  - id: aoi_catchment_c4
    title: Nakkhu catchment c4 (GLO-30 with OSM channel burned 60 m, pyflwdir), 55.82 km2
    method: aoi_build
    params: {product: catchment_c4, dest: configs/aoi/catchment_c4_glo30_osm_burned.geojson}
    url: "derived: nakkhu aoi build --only catchment_c4 (src/nakkhu/aoi/basins.py, configs/aoi/build.yaml; ported from configs/aoi/scripts/burn.py)"
    access: public
    licence: "own work (derived from Copernicus GLO-30 and OSM ODbL 1.0 lines)"
    attribution: "Nakkhu flood-exposure project; contains OpenStreetMap data (c) OpenStreetMap contributors, ODbL 1.0"
    citation: "this work"
    clip: none
    redistributable: "yes (ODbL share-alike for the OSM-derived part)"
  - id: aoi_osm_nakkhu_bagmati_lines
    title: OSM river lines of the Nakkhu, Nallu, Lele and Bagmati used for burning and reach length (11 ways)
    method: aoi_build
    params: {product: osm_lines, dest: configs/aoi/osm_nakkhu_bagmati_lines.geojson}
    url: "derived: nakkhu aoi build --only osm_lines (src/nakkhu/aoi/lines.py, configs/aoi/build.yaml): 11 way ids read from the fp_osm Geofabrik snapshot nepal-261003.osm.pbf (replication 2026-10-03T20:20:50Z)"
    access: public
    licence: ODbL 1.0
    attribution: "(c) OpenStreetMap contributors, ODbL 1.0"
    citation: "OpenStreetMap contributors (2026). https://www.openstreetmap.org"
    clip: none
    redistributable: "yes (ODbL share-alike)"
  - id: aoi_osm_waterways_rivers
    title: OSM waterway=river ways around the Kathmandu valley (raw Overpass JSON)
    method: aoi_build
    params: {product: waterways_rivers, dest: configs/aoi/osm_waterways_rivers.json}
    url: "derived: nakkhu aoi build --only waterways_rivers (src/nakkhu/aoi/lines.py, configs/aoi/build.yaml): way[waterway=river](27.45,85.20,27.75,85.45) from the fp_osm Geofabrik snapshot nepal-261003.osm.pbf (query text: configs/aoi/osm_waterways_rivers.overpassql)"
    access: public
    licence: ODbL 1.0
    attribution: "(c) OpenStreetMap contributors, ODbL 1.0"
    citation: "OpenStreetMap contributors (2026). https://www.openstreetmap.org"
    clip: none
    redistributable: "yes (ODbL share-alike)"
  - id: aoi_flood_reach_sites_2024
    title: Named Sept 2024 flood sites (points; OSM Nominatim or map-read)
    method: aoi_build
    params: {product: flood_sites, dest: configs/aoi/flood_reach_sites_2024.geojson}
    url: "derived: nakkhu aoi build --only flood_sites (src/nakkhu/aoi/sites.py) from configs/aoi/flood_reach_sites_2024.yaml (coordinates + per-site provenance; no live lookups)"
    access: public
    licence: "own work; coordinates from OSM Nominatim (ODbL 1.0) or map-read"
    attribution: "(c) OpenStreetMap contributors, ODbL 1.0"
    citation: "this work"
    clip: none
    redistributable: "yes (ODbL share-alike)"
  - id: aoi_training_domain
    title: Training domain = valid-data footprint of WorldView-2 10300100F5AB8000 (13 Jan 2024), all quadkeys
    method: aoi_training_domain
    params: {datamask: maxar_wv02_20240113_datamask, dest: configs/aoi/training_domain_wv02_20240113.geojson}
    url: "derived: union of the Maxar ARD data-mask polygons of catalog 10300100F5AB8000"
    access: public
    licence: "own work (geometry derived from Maxar Open Data STAC data masks, CC BY-NC 4.0)"
    attribution: "Nakkhu flood-exposure project; footprint of Maxar Open Data imagery"
    citation: "this work"
    clip: none
    redistributable: "yes (polygon only, no pixels)"

