    url: https://doi.org/10.5523/bris.s5hqmjcdj8yo2ibzi9b4ew3sn
    access: public
    licence: CC BY-NC-SA 4.0
    attribution: "FABDEM V1-2, University of Bristol (Neal & Hawker 2023), CC BY-NC-SA 4.0; produced using Copernicus WorldDEM-30 (c) DLR e.V. 2010-2014 and (c) Airbus Defence and Space GmbH 2014-2018 provided under COPERNICUS by the European Union and ESA"
    citation: "Hawker et al. (2022), Environ. Res. Lett. 17:024016, https://doi.org/10.1088/1748-9326/ac4d4f; Jeffrey Neal, Laurence Hawker (2023): FABDEM V1-2. https://doi.org/10.5523/bris.s5hqmjcdj8yo2ibzi9b4ew3sn"
    clip: routing
    redistributable: "no: CC BY-NC-SA 4.0; cite and point to the source"
    notes: "LICENCE QUESTION: the data.bris metadata 'Licence' field says 'Non-Commercial Government Licence for public sector information', while the dataset description and the shipped license.txt say CC BY-NC-SA 4.0 (checked 2026-10-05). Ask the user before use."
  - id: dem_gedtm30
    title: GEDTM30 v1.2 (global ensemble DTM, 30 m), windowed read clipped to routing domain + 2 km
    method: cog_clip
    params: {url: "https://s3.opengeohub.org/global/dtm/v1.2/gedtm_rf_m_30m_s_20060101_20151231_go_epsg.4326.3855_v1.2.tif", keep_source: false, vertical_datum: "EGM2008 (EPSG:3855, from the file VERTICAL_DATUM tag); raw values are metres (min 846.7 m vs GLO-30 845.6 m over the clip) although the band carries a scale tag of 0.1: do not apply that scale"}
    url: https://doi.org/10.5281/zenodo.18887460
    access: public
    licence: CC BY 4.0
    attribution: "GEDTM30 v1.2, OpenGeoHub / Open-Earth-Monitor (Ho et al. 2025), CC BY 4.0"
    citation: "Ho, Y.; Hengl, T. (2026). Global Ensemble Digital Terrain Model 30m (GEDTM30), version v1.2.0 (published 2026-03-06) [Data set]. Zenodo. https://doi.org/10.5281/zenodo.18887460 (concept DOI, all versions: https://doi.org/10.5281/zenodo.14900180); method: Ho et al. (2025), PeerJ 13:e19673, https://doi.org/10.7717/peerj.19673"
    clip: routing
    redistributable: "yes (CC BY 4.0)"
    notes: "The 30 m COG is the external link given in Zenodo record 18887460 (the Zenodo files themselves are 240 m). DOI check 2026-10-05 (Zenodo records API and DataCite): 10.5281/zenodo.14900180 is the concept DOI (HasVersion x5; it resolves to the latest version), 10.5281/zenodo.18887460 is version v1.2.0 published 2026-03-06 (IsVersionOf the concept; latest of v0 14900181 2025-02-24, v1 15490367 2025-05-22, v1.01 15645631 2025-06-11, v1.1 15689805 2025-06-11); its description links the gedtm_rf_m_30m_..._v1.2.tif COG read here. Cite the version DOI; .tmp/research-area-imagery.md cited the concept DOI only."
