    method: cog_clip
    params: {url: "https://glo-30-hand.s3.us-west-2.amazonaws.com/v1/2021/Copernicus_DSM_COG_10_N27_00_E085_00_HAND.tif", keep_source: true, vertical_datum: "relative height above nearest drainage (m), from GLO-30"}
