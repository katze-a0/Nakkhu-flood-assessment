    attribution: "Produced using Copernicus WorldDEM-30 (c) DLR e.V. 2010-2014 and (c) Airbus Defence and Space GmbH 2014-2018 provided under COPERNICUS by the European Union and ESA; all rights reserved"
    citation: "European Space Agency (2024). Copernicus Global Digital Elevation Model. https://doi.org/10.5270/ESA-c5d3d65"
    clip: routing
    redistributable: "yes (with the Copernicus notice)"
  - id: dem_fabdem
    title: FABDEM V1-2 (forests and buildings removed GLO-30), tile N27E085 from the N20E080-N30E090 zip, clipped to routing domain + 2 km
