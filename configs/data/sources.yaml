    access: registration
    licence: "NASA open data (NASA EOSDIS data use policy: no restrictions on use); OpenTopography page lists 'Use License: Not Provided' (checked 2026-10-17)"
    attribution: "NASA JPL (2020). NASADEM Merged DEM Global 1 arc second V001, NASA EOSDIS LP DAAC; distributed by OpenTopography"
