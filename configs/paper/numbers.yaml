# Manuscript numbers (plan 012 Step 2). `uv run nakkhu paper numbers` reads every entry and writes
# one \newcommand per entry into `output` (relative to nakkhu/), with its source, SHA-256,
# selector, raw value and status in a comment. Main.tex uses the macros, never a typed number.
#
# Entry fields:
#   source       file under artifacts/ (SHA-256 checked against INDEX.yaml), configs/ or a
#                complete run under runs/; null when no logged artifact exists (status missing)
#   select       dot path: key, [index] (negative allowed), [field=value,...] (one list element);
#                CSV files are lists of rows, e.g. "[inventory=google_v3].n_final"
#   field        optional: map a selected list of mappings to this field (a list of values)
#   values       instead of source/select: a list of {source, select[, field]}; the selected
#                values are concatenated into one list (e.g. one test eval run per seed)
#   aggregate    optional: count (length of the selected list or mapping), or mean, sd
#                (sample SD, ddof 1), min, max of a list of numbers
#   expr         instead of a source: arithmetic (+ - * /) over earlier entries' raw values;
#                a final expr may only use final entries
#   multiply_by  optional {source, select}: multiply by a second selected number (unit change)
#   scale        optional constant factor for a unit change only (e.g. 0.001 for m -> km)
#   format       Python format spec (default "{}"); "," thousands become {,} in LaTeX
#   status       final (printed) | val | prov (\todo, or \draftnum with --draft) | missing
#   note         free text for the comment
# Status follows plans/FINDINGS.md: only values marked final there are final here.
schema_version: 1
output: ../mdpi-journal-paper/numbers.tex

numbers:
  # --- study area (plan 002) ------------------------------------------------------------------
  numExtentKm:
    source: artifacts/tiling/tile_summary.json
    select: aoi_km2.analysis_extent
    format: "{:.2f}"
    status: final
    note: analysis extent area, km2 (registered AOI configs/aoi/aoi_recommended_analysis_extent.geojson)
  numDiscRadiusKm:
    source: configs/aoi/build.yaml
    select: analysis_extent.disc_radius_m
    scale: 0.001
    format: "{:g}"
    status: final
    note: confluence disc radius, km
  numReachSharePct:
    source: artifacts/aoi/reach_share.json
    select: reaches.main_stem.share
    scale: 100
    format: "{:.0f}"
    status: final
    note: share of the OSM main stem Tikabhairab -> confluence inside the extent, % (configs/aoi/reach.yaml)
  numReachKm:
    source: artifacts/aoi/reach_share.json
    select: reaches.main_stem.length_m
    scale: 0.001
    format: "{:.1f}"
    status: final
    note: main stem length Tikabhairab -> confluence along OSM, km
  numMappedReachSharePct:
    source: artifacts/aoi/reach_share.json
    select: reaches.mapped_water.share
    scale: 100
    format: "{:.0f}"
    status: final
    note: share of the stem from the UNOSAT-mapped upstream water end to the confluence, % (end +-100 m gives 92.3-93.7)
  numCatchmentKm:
    source: runs/aoi/20261005T191506Z-6a9f4120/summary.json
    select: products.catchment_c4.comparison.area_km2_registered
    format: "{:.2f}"
    status: final
    note: Nakkhu catchment c4 (GLO-30 + OSM burn), km2
  numRoutingKm:
    source: runs/aoi/20261005T191506Z-6a9f4120/summary.json
    select: products.routing_domain.comparison.area_km2_registered
    format: "{:.2f}"
    status: final
    note: registered upper Bagmati routing domain (unburned GLO-30, EPSG:4326 grid), km2
  numRoutingHandKm:
    source: artifacts/hand/routing_domain_comparison.csv
    select: "[domain=glo30__breach_burn (adopted)].area_km2"
    format: "{:.2f}"
    status: final
    note: routing domain re-delineated on the 30 m EPSG:32645 HAND grid, km2

