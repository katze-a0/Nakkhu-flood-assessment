# --- 1. Phase-2 candidates (a3 phase2.candidates applied) -----------------------------------
candidates:
  hand_rule:
    rule:
      mirror_of: configs/prereg_addenda/prereg_v9_a3.yaml#phase2.candidates.hand_rule
      values: the main-river variant with the highest Phase-1 AUC on Microsoft R1 among
        {hand_mr_d8, hand_mr_rem, hand_team_acc (breach_burn)} x {glo30, fabdem}, compared on the
        P1-9 covered rows (the only rows all members share); if within 0.005 of the best, prefer
        glo30 over fabdem, then hand_mr_d8, then hand_team_acc, then hand_mr_rem
    row_set: the P1-9 covered rows (finite hand_team; 4,014) on which all six members are finite
      - n 3,920, 196 affected, 18 blocks (hand_team_acc is NaN on 49 / 62 covered rows)
    evidence: # artifacts/followup/p2_select_hand_members.csv (journal 64), Microsoft R1
      - {member: hand_mr_d8 x glo30, auc: 0.90704}
      - {member: hand_team_acc x glo30, auc: 0.90697}
      - {member: hand_mr_d8 x fabdem, auc: 0.90691}
      - {member: hand_team_acc x fabdem, auc: 0.90680}
      - {member: hand_mr_rem x glo30, auc: 0.90546}
      - {member: hand_mr_rem x fabdem, auc: 0.90447}
    applied: best = hand_mr_d8 x glo30 (0.90704); all six lie within 0.005 of it (tied); the tie
      order (glo30, then hand_mr_d8) gives hand_mr_d8 x glo30 - the same member either way
      (artifacts/followup/p2_select_rule.json)
    frozen:
      predictor: hand_mr_d8
      dem: glo30
      conditioning: breach_burn
      statistic: centroid
      orientation: lower value = more exposed (score = -value)
      definition:
        mirror_of: configs/prereg_addenda/prereg_v9_a3.yaml#definitions.hand_mr_d8
        values: max(0, z_ref(c) - z_ref(m(c))), m(c) = first cell of M on the D8 path from c
          (breach_burn routing of the same DEM); NaN if the path leaves the grid without reaching
          M
      main_mask_at_site: M_site = cells of the sweep grid touched (all_touched) by the site's
        main lines (section 2) AND with D8 contributing area >= 1 km2 on GLO-30 breach_burn (the
        a3 main_mask rule with the site's lines in place of the Nakkhu/Bagmati ways)
      routing: # the GLO-30 breach_burn routing of the frozen v9 sweep, reused unchanged
        sweep_run: hand/20261005T191226Z-dc9658f5
        dem_ref: 5d7c00b232fa23e60952a6de6f150b9a6585d8454b3bd8d7e3601f625ed1ece8
        fdir: 445e4b704708bbbc9ba6c9b0f3da1555c1ba2980eacfba5b3f3c1c401231399f
        acc: 58977604a892dede8a1fcf82efdce67e46079e5480d0404d873e640544db9d84
        dem_glo30: 1f3c7ee85c6926d6adb6bd3c76f996f19fbc2c45dbcb2471b2e936818b5bfc33
        hand_v9_surface: 4f499d323021cf4888e920b5ca65c1b1dab43318a3a56154b9edd099b5aa3d98
      routing_grid:
        mirror_of: configs/hand/sweep.yaml#grid
        values: {crs: "EPSG:32645", res_m: 30, buffer_m: 2000, resampling: bilinear,
                 domain: configs/aoi/routing_domain_upper_bagmati_glo30.geojson}
  ml_model:
    rule:
      mirror_of: configs/prereg_addenda/prereg_v9_a3.yaml#phase2.candidates.ml_model
      values: the P1-6 family with the highest pooled OOF AUC on Microsoft R1; if within 0.005
        of the best, prefer M-C, then M-E, then M-D; refit on all Nakkhu Microsoft R1 rows with
        the config chosen by 5-fold GroupKFold (same search, seed 0); no recalibration later
    evidence: # p1_6_models.csv, Microsoft R1, 6,769 rows, 352 affected, 26 outer folds
      - {family: M-E, oof_auc: 0.90351}
      - {family: M-C, oof_auc: 0.90028}
      - {family: M-D, oof_auc: 0.89467}
    applied: best M-E; M-C is 0.0032 below it (within 0.005), so the tie order picks M-C
    frozen:
      family: M-C (penalised logistic GAM, natural cubic spline df 4 per feature, knots at the
        1/25/50/75/99th percentiles of the training values, values outside the boundary knots
        clamped, L2 penalty on all non-intercept coefficients)
      refit: journal 64; all 6,769 Nakkhu Microsoft R1 rows (352 affected, 26 blocks, 0 rows
        with a NaN feature); 5-fold GroupKFold by block; mean inner log-loss per lambda
        [0.001 0.2969, 0.01 0.2023, 0.1 0.1642, 1 0.1455, 10 0.1361, 100 0.1511]
      selected_lambda: 10.0
      model_file: artifacts/followup/p2_mc_model.json (pins.mc_model)
      feature_spec: artifacts/followup/p2_mc_feature_spec.json (pins.mc_feature_spec)
      predict: nakkhu.followup.explore.predict(model, site predictor table); a row with any
        non-finite feature gets no prediction
      at_site: every feature is computed label-free for the site's buildings with the site's
        main lines and M_site wherever the a3 definition names the main river (hand_mr_d8,
        hand_mr_rem, hand_mr_d8_fabdem, log1p distance, flowdist_main, log10 area at m(c)); all
        other features as in P1-6; no refit, no recalibration, no imputation
  no_gate:
    mirror_of: configs/prereg_addenda/prereg_v9_a3.yaml#phase2.candidates.no_gate
    values: both candidates go to Phase 2 whatever their Phase-1 result
  extra_candidates: none (the Holm family stays {H2a, H2b})

