    N:
      pre: d7e74c49f28f255932dd023022f7d539c0ff5a69978294e4d6455b8c50f1893c
      post: 38af7d1094089a340d66d35fb8ae4795497d3e15599c52e8c2b6814b25f6d07f
      record: artifacts/followup/phase2/site_N_mosaics.json
  footprint_registration: # decision 4 - plan-004 method and settings (labels/common.yaml), v9
    # thresholds (footprints 1.2161, OSM 1.2247), Google v3 uncut + Microsoft (and OSM) on the
    # site's 320 m lattice tiles of the site pre mosaic (v9 used the JPEG train tiles)
    A: {tiles: 389, footprints_ok: 219, osm_ok: 165, record: artifacts/followup/phase2/site_A_registration.json}
    B: {tiles: 254, footprints_ok: 145, osm_ok: 71, record: artifacts/followup/phase2/site_B_registration.json}
    N: {tiles: 439, footprints_ok: 225, osm_ok: 164, record: artifacts/followup/phase2/site_N_registration.json}
  ground_mask_layers: google_v3_uncut (fp_google_v3_routing), microsoft (fp_microsoft_routing),
    osm (pinned PBF, artifacts/followup/phase2/site_osm_footprints.json) as change.yaml
    buildings.ground_mask_from
  sentinel2: same 45RUL scenes as v9 (23 Sep and 1 Oct 2024)
  reference: R1 (gated change-map class on observable buildings), per site
  secondary_reference:
    mirror_of: configs/prereg_addenda/prereg_v9_a3.yaml#phase2.labels.secondary_reference
    values: UNOSAT Spot-6 R-UN and R-UN-pts (as P1-8) on the same sites; reported, no decision

# --- 4. P2-audit design (a3 tests.P2-audit, phase2.labels.audit) ---------------------------
audit:
  rule:
    mirror_of: configs/prereg_addenda/prereg_v9_a3.yaml#phase2.labels.audit
    values: a V1 audit per site with the v9 flood_trace protocol and strata, 150 active items +
      8 repeats per site, blind (imagery only), one sitting for all sites; drop rule as v9 per
      site (PPV Wilson lower bound < 0.5 drops that site's change map)
  sites: [A, B]               # N is not audited
  task: flood_trace_p2 (configs/audit/audit.yaml tasks.flood_trace_p2; a new task - the v9 tasks
    and their protocol are unchanged); items are drawn by `nakkhu audit sample --task
    flood_trace_p2`, which refuses until this addendum is frozen and reads the site change maps
    pinned in configs/followup/phase2/p2_change_maps.yaml (written after G6); chips by `nakkhu
    audit chips --task flood_trace_p2` (pre = the first of the site's WV02 strips with valid
    pixels at the building, F5AB8000 then F2BCCF00 for site A and F5AB8000 for site B; post =
    GE01 0600)
  frame: per site, the observable Microsoft buildings of that site's change map in its extent
  strata: positive; negative within 300 m of the site's main lines (negative_near); negative
    farther (negative_far) - the v9 flood_trace strata (audit.yaml tasks.flood_trace)
  allocation: per site, sqrt allocation of 150 over the three strata, >= 10 per stratum, then
    the v9 rebalance scaled to 150 - the positive stratum gets 50 items (all of it if smaller),
    taken from negative_far (user decision 2026-10-17)
  repeats: 8 per site (repeat_frac 0.05 of 150, rounded up), each >= 20 items after its
    original
  seed: 0
  order: the 316 items of both sites in one random order (seed 0), so position reveals neither
    site nor stratum
  page: v9 flood_trace page - chips only (pre WV02 of the strip that supplied the building's
    pre pixels, post GE01 0600; 0.305 m visual sources; 64 m context, 2x); question, keys and the
    damage follow-up as audit.yaml tasks.flood_trace / damage; auditor = author
  estimates: per site - PPV and NPV, design-weighted (N_h / n_h), Wilson 95 %; Not observable
    excluded; repeats give self-agreement only
  drop_rule: per site - PPV Wilson lower bound < 0.5 drops that site's change map and the site
    leaves the pool (a3 site_failure)
  journal: one estimate run, note `prereg_v9_a3:P2-audit`, reserved on the laptop
    (`nakkhu followup reserve --test P2-audit`, executed remotely; nakkhu.followup.p2audit) -
    it reads the primary rater's log only (raters/rater_1/responses.jsonl) and writes
    artifacts/followup/p2_audit_estimates.json (per site PPV / NPV / drop rule), the file P2
    reads; the rater's self-agreement on the repeats comes from `nakkhu audit agreement --task
    flood_trace_p2` (and `--task damage_p2` for the follow-up), with no decision
  sessions: one audit task, answered in up to 3 sessions of <= 30 min (orchestrator approval
    2026-10-17, reading a3's "one sitting" as one item set and one estimate); the v9 120-min
    cap applies to the rater's own logged time on this task
  pacing: 10-15 s per item (about 55-80 min for 316 items); the pace guidance (instruction
    card) and the soft fast-answer warning (logged as `pace_warning`, answers never refused)
    apply to EVERY rater of flood_trace_p2, the author included (orchestrator decision
    2026-10-17; tasks.flood_trace_p2.pace_all_raters is true)
  raters: # the user's answer (2026-10-17): one auditor, remote, unnamed
    n_raters: 1
    primary_rater: rater_1      # the one remote rater (configs/audit/audit.yaml
      # tasks.flood_trace_p2.primary_rater); the gate (drop rule) and the PPV / NPV use its log
    remote_access: the rater answers on the audit page through the user's own private tunnel
      with a per-rater token (`nakkhu audit invite`, stored as a hash only); answers go to
      audit/flood_trace_p2/raters/rater_1/responses.jsonl
    design: the rater answers every P2-audit item of both sites in an own random order (seed
      from the rater id) with own repeats (8 per site)
    secondary_no_decision: self-agreement of the rater on the repeats (Cohen's kappa with a
      bootstrap 95 % CI); with one rater there is no inter-rater kappa
    blindness: the rater sees no change-map class, stratum, site, HAND or distance

# --- 5. Size check, modes, hypotheses, test, decision (a3, unchanged) ----------------------
size_check:
  mirror_of: configs/prereg_addenda/prereg_v9_a3.yaml#phase2.size_check
  values: computed inside the P2 run before any predictor is read - n_blocks (blocks with
    >= 1 observable building) and R1 affected count over the pooled set
modes:
  mirror_of: configs/prereg_addenda/prereg_v9_a3.yaml#phase2.modes
  values:
    confirmatory: n_blocks >= 26 and affected >= 150 and the change map kept by the audit
    descriptive: otherwise - point estimates and CIs reported as "underpowered / no valid
      reference, not confirmatory"; no hypothesis decision is reported
hypotheses:
  mirror_of: configs/prereg_addenda/prereg_v9_a3.yaml#phase2.hypotheses
  values:
    H2a: AUC(frozen HAND rule) - AUC(distance_competitor of the site) > 0
    H2b: AUC(frozen ML model) - AUC(distance_competitor of the site) > 0
    rows: H2a on the pooled R1 rows where the frozen HAND rule is finite (all rows unless it is
      hand_team_acc), H2b on all pooled R1 rows; distance on the same rows in each; the size
      check and mode apply to the H2a rows for H2a
rows_clarification: decision 3 (2026-10-17) - hand_mr_d8 is NaN where the D8 path never
  reaches M_site, and M-C cannot score a row with a non-finite feature; H2a is scored on the
  pooled R1 rows where hand_mr_d8 is finite and H2b on those where every M-C feature is
  finite; distance is ALWAYS restricted to exactly the rows of that hypothesis (same rows for
  candidate and distance); the size check, MDE and mode are computed on those rows; the NaN
  count and share are reported prominently, pooled and per site, in p2_confirm.json
  (`nan`, `sites.<s>.share_nan_H2a / _H2b`) - label-free site-B share 31 % before observability
implementation: nakkhu.followup.confirm (P2 through the receipt flow, note prereg_v9_a3:P2);
  its inputs are pinned in configs/followup/phase2/p2_inputs.yaml (site predictor tables,
  site change maps, the primary rater's P2-audit estimates, the M-C model), written after G7
test:
  mirror_of: configs/prereg_addenda/prereg_v9_a3.yaml#phase2.test
  values: one-sided paired block bootstrap, 2000 resamples of whole blocks stratified by site,
    seed 0; p = (1 + #{delta* <= 0}) / (2000 + 1)
decision:
  mirror_of: configs/prereg_addenda/prereg_v9_a3.yaml#phase2.decision
  values: Holm over {H2a, H2b} at family-wise alpha 0.05 one-sided - reject the smaller p if
    p <= 0.025, then the other if p <= 0.05; a missing candidate counts as p = 1
reported:
  mirror_of: configs/prereg_addenda/prereg_v9_a3.yaml#phase2.reported
  values: delta AUC with the two-sided 95 % percentile CI and the one-sided 97.5 % lower
    bound, DeLong; secondary (no decision) - v9 rule hand_v9 vs distance (C3 replication), ML
    vs frozen HAND, tier hit rates and ORs of the frozen HAND rule, per-site rows, both
    hypotheses against the UNOSAT references, the negative-control river
mde: computed from the pooled block count and written before scoring (a3 power_planning -
  0.048 at 26 blocks, 0.039 at 40, 0.030 at 67, 0.020 at 150; SE about 0.017 x sqrt(26 / n))

# --- 6. Tests (P2-audit and P2 stay a3 tests: notes prereg_v9_a3:P2-audit / :P2) ----------
tests:
  P2-site-check:
    title: the label-free site checks recorded above (imagery, geometry, registration,
      co-registration, predictors); no label, not journalled
    access: none
